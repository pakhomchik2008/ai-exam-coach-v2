<!doctype html>
<html lang="en" data-theme="cream">
<head>
<script>
/* Preview/local hosts must not keep OneSignal's worker. It is scoped to
   production, and a leftover SW intercepts hashed /assets/*.js after a
   deploy — Safari then paints a blank page. Drop it before the bundle. */
(function () {
  var host = location.hostname;
  if (host === "ai-exam-coach-v2.vercel.app" || host === "examik.app" || host === "www.examik.app") return;
  if (!navigator.serviceWorker) return;
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    if (!regs.length) return;
    Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
      location.reload();
    });
  });
})();
</script>
<!-- Sentry — loaded first so it can catch errors from the bundle below it,
     including a bundle that fails to parse or load at all. That is why it stays
     a CDN tag rather than moving into the bundle it is meant to watch. -->
<script
  src="https://js-de.sentry-cdn.com/f944c5545143a5d01254af4c96e734d3.min.js"
  crossorigin="anonymous"
></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Examik</title>
<meta name="description" content="Personal tutor for NMT, IELTS, GCSE, SAT. Forecast your score. Stop guessing." />
<meta name="theme-color" content="#FAFAF8" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:title" content="Examik" />
<meta property="og:description" content="Forecast your score. Stop guessing." />
<meta property="og:image" content="/brand/lockup-og.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="/brand/lockup-og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Gabarito:wght@500..800&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@500;700&display=swap" />
<!-- Kept out of /assets/ deliberately: Vite content-hashes everything it emits
     there, so that path carries a 1-year immutable cache header (vercel.json).
     An unhashed file living under it could never be updated. -->
<link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png" />
<link rel="icon" href="/favicon.svg" />
<style>
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes loadDot { 0%, 80%, 100% { opacity: .3; transform: scale(.7); } 40% { opacity: 1; transform: scale(1); } }
  @keyframes revealUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  /* Floating "+N XP" gain in the Learn game HUD: rise and fade. */
  @keyframes xppop { 0% { opacity: 0; transform: translateY(6px) scale(0.9); } 25% { opacity: 1; transform: translateY(0) scale(1.05); } 100% { opacity: 0; transform: translateY(-16px) scale(1); } }
  @media (prefers-reduced-motion: reduce) { @keyframes xppop { 0% { opacity: 1; } 100% { opacity: 0; } } }
  html, body { margin: 0; min-height: 100%; background: #F7F5F0; }
  #root { min-height: 100vh; }

  /* Four rooms fit a phone. Hamburger of seven is gone. */
  .app-nav-links { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
  .app-nav-more-backdrop {
    position: fixed; inset: 0; z-index: 70; border: 0; padding: 0; cursor: pointer;
    background: rgba(20, 24, 34, 0.28);
  }
  .app-nav-more-sheet {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 80;
    min-width: 240px; padding: 8px;
    background: var(--surface-nav, #fff);
    border: 1px solid var(--border-default, #e5e2dc);
    border-radius: 16px; box-shadow: var(--shadow-lg, 0 12px 40px rgba(20,24,34,0.12));
    animation: app-nav-sheet-in 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes app-nav-sheet-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .app-nav-more-sheet { animation: none; }
  }
  @media (max-width: 640px) {
    .app-nav-wordmark { display: none; }
  }
  @media (max-width: 520px) {
    .app-nav-lang-caret { display: none; }
    .app-nav-room { padding: 8px 10px; font-size: 13px; }
    .app-nav-more-sheet {
      position: fixed; top: auto; right: 12px; left: 12px;
      bottom: max(12px, env(safe-area-inset-bottom, 0px));
      min-width: 0;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>

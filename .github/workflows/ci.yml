name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        # `no-undef` is the load-bearing rule here: the Vite migration moved 43
        # files out of one shared global scope into ES modules, and this is what
        # catches a cross-module reference that no longer resolves.
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Curriculum trust regression suite
        run: npm run test:trust

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        # Phase 6 requires failing on high; enforcing it from the start keeps the
        # dependency tree from drifting back into a vulnerable state.
        run: npm audit --audit-level=high --omit=dev
